plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services' // <--- 1. ДОБАВЛЕН ПЛАГИН
}

android {
    namespace 'com.taxiapp.client'

    Properties properties = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
    }
    compileSdk 36

    defaultConfig {
        applicationId "com.taxiunit.unitapp"
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName "1.0.7"
        buildConfigField "String", "GOOGLE_PLACES_API_KEY", "\"${properties.getProperty('GOOGLE_PLACES_API_KEY', '')}\""

        buildConfigField "String", "BASE_URL", "\"http://192.168.0.107:8080/\""

        // 🔥 ДОБАВЛЯЕМ СЮДА: Читаем ключ карт из свойств и пробрасываем в Манифест
        manifestPlaceholders = [mapsApiKeyPlaceholder: properties.getProperty("MAPS_API_KEY", "")]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // ВАЖНО: Я удалил отсюда строку "classpath ...", она должна быть только в файле проекта!
    // Добавь в dependencies, если еще не добавлено:
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.google.maps.services

    // --- ИСПОЛЬЗУЕМ ПСЕВДОНИМЫ ИЗ TOML ---
    implementation libs.google.material
    implementation libs.squareup.retrofit
    implementation libs.squareup.retrofit.converter.gson
    implementation libs.google.gms.maps
    implementation libs.google.libraries.places
    implementation libs.google.maps.utils
    implementation libs.androidx.recyclerview
    implementation libs.google.glide
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    annotationProcessor libs.google.glide.compiler
    implementation libs.facebook.shimmer

    // <--- 2. ДОБАВЛЕНА БИБЛИОТЕКА FIREBASE MESSAGING
    implementation 'com.google.firebase:firebase-messaging:23.4.1'

    implementation 'com.github.NaikSoftware:StompProtocolAndroid:1.6.6'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}